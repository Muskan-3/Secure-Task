name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_securetask
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d test_securetask"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        env:
          # Test-only values for this CI run. Not real secrets, never used outside this job.
          SECRET_KEY: ci-test-only-secret-key-do-not-use-in-production
          DATABASE_URL: postgresql+psycopg2://test_user:test_password@localhost:5432/test_securetask
        run: pytest -v --cov=app --cov-report=term-missing
