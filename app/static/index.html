<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>SecureTask</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main class="container">

    <!-- Auth screen -->
    <section id="auth-view" class="view" hidden>
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✓</span>
        <h1>SecureTask</h1>
        <p class="tagline">Your tasks, kept private.</p>
      </div>

      <div class="card auth-card">
        <div class="tabs" role="tablist">
          <button type="button" class="tab" id="tab-login" role="tab" aria-selected="true" data-mode="login">Log in</button>
          <button type="button" class="tab" id="tab-register" role="tab" aria-selected="false" data-mode="register">Create account</button>
        </div>

        <form id="auth-form" novalidate>
          <div class="field">
            <label for="auth-email">Email</label>
            <input id="auth-email" name="email" type="email" autocomplete="email" required placeholder="you@example.com">
          </div>
          <div class="field">
            <label for="auth-password">Password</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters">
            <p class="hint" id="password-hint" hidden>Use at least 8 characters.</p>
          </div>
          <p class="form-error" id="auth-error" role="alert" hidden></p>
          <button type="submit" class="btn btn-primary btn-block" id="auth-submit">Log in</button>
        </form>
      </div>
    </section>

    <!-- Tasks screen -->
    <section id="tasks-view" class="view" hidden>
      <header class="app-header">
        <div class="app-title">
          <span class="brand-mark small" aria-hidden="true">✓</span>
          <span>SecureTask</span>
        </div>
        <div class="user-box">
          <span class="user-email" id="user-email"></span>
          <button type="button" class="btn btn-ghost" id="logout-btn">Log out</button>
        </div>
      </header>

      <form id="add-form" class="card add-card" novalidate>
        <h2>Add a task</h2>
        <div class="field">
          <label for="task-title" class="sr-only">Title</label>
          <input id="task-title" type="text" placeholder="What needs doing?" maxlength="200" required>
        </div>
        <div class="field">
          <label for="task-desc" class="sr-only">Description (optional)</label>
          <textarea id="task-desc" rows="2" placeholder="Description (optional)" maxlength="1000"></textarea>
        </div>
        <p class="form-error" id="add-error" role="alert" hidden></p>
        <button type="submit" class="btn btn-primary" id="add-submit">Add task</button>
      </form>

      <div class="list-head">
        <h2>Your tasks</h2>
        <span class="counter" id="task-counter"></span>
      </div>

      <p class="loading" id="tasks-loading" hidden>Loading tasks…</p>
      <div class="empty card" id="empty-state" hidden>
        <span class="empty-icon" aria-hidden="true">📝</span>
        <p>No tasks yet - add your first one above</p>
      </div>
      <ul class="task-list" id="task-list"></ul>
    </section>

  </main>

  <div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
